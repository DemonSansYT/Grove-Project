<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grove Online - Prototip</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
  }
  canvas { display: block; }

  #clockPanel {
    position: fixed;

  }

  }
  #healthBarOuter {

  }
  #healthBarInner {

  #hud {

  }
  #hud b { color: #7CFC00; }

  #versionTag {
    position: fixed;
    top: 10px;
    right: 14px;
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: monospace;

  }

  #debugToggleBtn {
    position: fixed;
    top: 46px;

    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.3);

  #debugToggleBtn.hasNew {

  #debugPanel {

  /* --- Chat kutusu --- */
  #chatBox {
    position: fixed;
    top: 273px;
    left: 10px;
    width: 260px;
    max-width: calc(100vw - 20px);

    flex-direction: column;
  }
  #chatMessages {
    max-height: 150px;

  /* --- Join ekranı --- */
  #nameEntry {

  .charOption {

  #leashControl {

  #zapBtn {

    color: #fff;
    font-size: 15px;
    font-weight: bold;
    z-index: 20;
    touch-action: none;
    display: none;

</style>

<body>

<div id="nameEntry">

  <div id="characterSelect">

<script type="module">
  // ---------------------------------------------------------
  // FIREBASE SETUP (Firestore)
  // ---------------------------------------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore, doc, setDoc, deleteDoc, onSnapshot,
    collection, serverTimestamp, addDoc, query, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5u1AIZmaKfXPrwaJMlJF7y09RJ1vdN9U",
    authDomain: "grove-street-2c5c6.firebaseapp.com",
    projectId: "grove-street-2c5c6",
    storageBucket: "grove-street-2c5c6.firebasestorage.app",
    messagingSenderId: "743102061127",
    appId: "1:743102061127:web:9781e761b83c3263d2ef62"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ROOM_ID = "prototype-room";
  const playersCol = collection(db, "rooms", ROOM_ID, "players");
  const chatCol = collection(db, "rooms", ROOM_ID, "chat");

  // --- DEBUG PANELİ (buton ile açılır/kapanır) ---
  const debugPanel = document.getElementById("debugPanel");
  const debugToggleBtn = document.getElementById("debugToggleBtn");
  let debugPanelOpen = false;

  debugToggleBtn.addEventListener("click", () => {
    debugPanelOpen = !debugPanelOpen;
    debugPanel.style.display = debugPanelOpen ? "block" : "none";
    debugToggleBtn.classList.remove("hasNew");
  });

  function dlog(msg) {
    const line = document.createElement("div");
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    debugPanel.appendChild(line);
    debugPanel.scrollTop = debugPanel.scrollHeight;
    if (!debugPanelOpen) debugToggleBtn.classList.add("hasNew");
    console.log(msg);
  }
  window.addEventListener("error", (e) => dlog("JS HATA: " + e.message));
  dlog("Firebase başlatıldı, projectId=" + firebaseConfig.projectId);

  // ---------------------------------------------------------
  // THREE.JS SETUP
  // ---------------------------------------------------------
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Işıklandırma
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(hemiLight);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  sunLight.position.set(20, 30, 10);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -40;
  sunLight.shadow.camera.right = 40;
  sunLight.shadow.camera.top = 40;
  sunLight.shadow.camera.bottom = -40;
  scene.add(sunLight);

  // Zemin (yolların altındaki/dışındaki genel toprak/çim alanı)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x5a6b4a })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------------------------------------------------------
  // ORGANİK YOL AĞI ÜRETİMİ
  // Izgara düğümleri arasında rastgele (ama bağlantılı) kenarlarla "karışık" bir
  // sokak ağı kuruyoruz: çıkmaz sokaklar, dönüşler, bazı döngüler (loop) oluşuyor.
  // Şehrin kenarları asfaltın aniden kesilmesi yerine kaldırımlı çıkmaz sokaklarla yumuşak bitiyor.
  // ---------------------------------------------------------
  const PLAYER_HEIGHT = 2.2;
  const ROAD_WIDTH = PLAYER_HEIGHT * 3.2;      // ~7
  const SIDEWALK_WIDTH = PLAYER_HEIGHT * 1.0;  // ~2.2 - genişletildi
  const CURB_HEIGHT = 0.18;
  const NODE_SPACING = ROAD_WIDTH + 14;        // düğümler arası mesafe
  const GRID_N = 6;                            // 6x6 düğüm ızgarası - küçük şehir

  const cityGroup = new THREE.Group();
  const collidables = []; // { minX, maxX, minZ, maxZ } - oyuncu/kedi çarpışma listesi
  function registerCollider(x, z, w, d) {
    collidables.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  }
  scene.add(cityGroup);

  const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2e });
  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x9a9a92 });
  const dashMat = new THREE.MeshStandardMaterial({ color: 0xe8e0c0 });

  const gridOffset = -(GRID_N - 1) * NODE_SPACING / 2;
  function nodeWorldX(gx) { return gridOffset + gx * NODE_SPACING; }
  function nodeWorldZ(gz) { return gridOffset + gz * NODE_SPACING; }

  // Bir yol segmenti (asfalt + iki yanda yükseltilmiş kaldırım + beyaz kesikli orta çizgi) çizer.
  // x1,z1 -> x2,z2 sadece X ya da sadece Z ekseninde değişebilir (eksene hizalı).
  function addStraightRoad(x1, z1, x2, z2, shrinkStart, shrinkEnd) {
    shrinkStart = shrinkStart || 0;
    shrinkEnd = shrinkEnd || 0;
    const horizontal = z1 === z2;
    const midX = (x1 + x2) / 2, midZ = (z1 + z2) / 2;
    const len = horizontal ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
    if (len < 0.01) return;
    const dirSign = horizontal ? Math.sign(x2 - x1) : Math.sign(z2 - z1);

    // Asfalt - tam uzunlukta, düğüm merkezine kadar (boşluk kalmasın)
    const asphalt = new THREE.Mesh(
      new THREE.PlaneGeometry(horizontal ? len : ROAD_WIDTH, horizontal ? ROAD_WIDTH : len),
      asphaltMat
    );
    asphalt.rotation.x = -Math.PI / 2;
    asphalt.position.set(midX, 0.02, midZ);
    asphalt.receiveShadow = true;
    cityGroup.add(asphalt);

    // Kaldırımlar - kavşaklarda çapraz yoldaki asfaltın üstüne binmesin diye
    // her iki uçta da (varsa) kavşak payı kadar içeri çekiliyor
    const swLen = len - shrinkStart - shrinkEnd;
    if (swLen > 0.1) {
      const localMid = (shrinkStart + (len - shrinkEnd)) / 2; // segment başından itibaren
      const swMidX = horizontal ? x1 + dirSign * localMid : midX;
      const swMidZ = horizontal ? midZ : z1 + dirSign * localMid;
      const offset = ROAD_WIDTH / 2 + SIDEWALK_WIDTH / 2;
      [-1, 1].forEach((side) => {
        const geo = new THREE.BoxGeometry(
          horizontal ? swLen : SIDEWALK_WIDTH,
          CURB_HEIGHT,
          horizontal ? SIDEWALK_WIDTH : swLen
        );
        const sw = new THREE.Mesh(geo, sidewalkMat);
        if (horizontal) sw.position.set(swMidX, CURB_HEIGHT / 2 + 0.02, swMidZ + side * offset);
        else sw.position.set(swMidX + side * offset, CURB_HEIGHT / 2 + 0.02, swMidZ);
        sw.receiveShadow = true;
        sw.castShadow = true;
        cityGroup.add(sw);
      });
    }

    // Beyaz kesikli orta çizgi - GERÇEK GEOMETRİ, doku değil
    const dashLen = 1.6, gapLen = 1.4, dashW = 0.18;
    const totalDash = dashLen + gapLen;
    const count = Math.floor(len / totalDash);
    for (let i = 0; i < count; i++) {
      const t = -len / 2 + totalDash * i + dashLen / 2 + (len - count * totalDash) / 2;
      const dash = new THREE.Mesh(
        new THREE.BoxGeometry(horizontal ? dashLen : dashW, 0.02, horizontal ? dashW : dashLen),
        dashMat
      );
      dash.position.set(midX + (horizontal ? t : 0), 0.035, midZ + (horizontal ? 0 : t));
      cityGroup.add(dash);
    }
  }

  // Kavşak/dönüş noktalarını yuvarlak asfaltla doldurup dönüşleri yumuşatır
  function addJunctionRound(x, z) {
    const circle = new THREE.Mesh(
      new THREE.CircleGeometry(ROAD_WIDTH / 2, 20),
      asphaltMat
    );
    circle.rotation.x = -Math.PI / 2;
    circle.position.set(x, 0.021, z);
    circle.receiveShadow = true;
    cityGroup.add(circle);
  }

  // Bir düğümün etrafında yol OLMAYAN kenarları kaldırımla kapat
  // (yol sadece bazı yönlerde varsa, boş kalan kenarlar/köşeler kaldırımsız kalmasın)
  function addOpenEdgeSidewalks(gx, gz, connDirs) {
    const nx = nodeWorldX(gx), nz = nodeWorldZ(gz);
    const r = ROAD_WIDTH / 2;
    const cardinals = { E: [1, 0], W: [-1, 0], S: [0, 1], N: [0, -1] };

    Object.entries(cardinals).forEach(([dirName, [dx, dz]]) => {
      if (connDirs.has(dirName)) return;
      const capGeo = new THREE.BoxGeometry(
        dx !== 0 ? SIDEWALK_WIDTH : ROAD_WIDTH,
        CURB_HEIGHT,
        dx !== 0 ? ROAD_WIDTH : SIDEWALK_WIDTH
      );
      const cap = new THREE.Mesh(capGeo, sidewalkMat);
      cap.position.set(nx + dx * (r + SIDEWALK_WIDTH / 2), CURB_HEIGHT / 2 + 0.02, nz + dz * (r + SIDEWALK_WIDTH / 2));
      cap.receiveShadow = true;
      cityGroup.add(cap);
    });

    const diagonalCorners = [
      { dirs: ["N", "E"], sx: 1, sz: -1 },
      { dirs: ["N", "W"], sx: -1, sz: -1 },
      { dirs: ["S", "E"], sx: 1, sz: 1 },
      { dirs: ["S", "W"], sx: -1, sz: 1 }
    ];
    diagonalCorners.forEach(({ dirs, sx, sz }) => {
      if (connDirs.has(dirs[0]) || connDirs.has(dirs[1])) return;
      const off = r + SIDEWALK_WIDTH / 2;
      const corner = new THREE.Mesh(new THREE.BoxGeometry(SIDEWALK_WIDTH, CURB_HEIGHT, SIDEWALK_WIDTH), sidewalkMat);
      corner.position.set(nx + sx * off, CURB_HEIGHT / 2 + 0.02, nz + sz * off);
      corner.receiveShadow = true;
      cityGroup.add(corner);
    });
  }

  // Çıkmaz sokak ucu: kısa bir "kütük" yol uzantısı + ucuna kapatan kaldırım
  function addDeadEndCap(nx, nz, dirX, dirZ) {
    const stubLen = ROAD_WIDTH * 0.6;
    const tipX = nx + dirX * stubLen, tipZ = nz + dirZ * stubLen;
    addStraightRoad(nx, nz, tipX, tipZ);

    const capGeo = new THREE.BoxGeometry(
      dirX !== 0 ? SIDEWALK_WIDTH : ROAD_WIDTH + SIDEWALK_WIDTH * 2,
      CURB_HEIGHT,
      dirX !== 0 ? ROAD_WIDTH + SIDEWALK_WIDTH * 2 : SIDEWALK_WIDTH
    );
    const cap = new THREE.Mesh(capGeo, sidewalkMat);
    cap.position.set(tipX + dirX * (SIDEWALK_WIDTH / 2), CURB_HEIGHT / 2 + 0.02, tipZ + dirZ * (SIDEWALK_WIDTH / 2));
    cap.receiveShadow = true;
    cityGroup.add(cap);
  }

  // --- Izgara düğümlerini rastgele (ama tamamen bağlantılı) bir ağaç + birkaç döngü ile bağla ---
  function keyOf(gx, gz) { return gx + "_" + gz; }

  const visited = [];
  for (let gx = 0; gx < GRID_N; gx++) { visited.push(new Array(GRID_N).fill(false)); }

  const centerGX = Math.floor(GRID_N / 2), centerGZ = Math.floor(GRID_N / 2);
  visited[centerGX][centerGZ] = true;

  let frontier = [];
  function addFrontier(gx, gz) {
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
      const nx = gx + dx, nz = gz + dz;
      if (nx >= 0 && nx < GRID_N && nz >= 0 && nz < GRID_N && !visited[nx][nz]) {
        frontier.push([gx, gz, nx, nz]);
      }
    });
  }
  addFrontier(centerGX, centerGZ);

  const acceptedEdges = [];
  while (frontier.length) {
    const idx = Math.floor(Math.random() * frontier.length);
    const [ax, az, bx, bz] = frontier.splice(idx, 1)[0];
    if (visited[bx][bz]) continue;
    visited[bx][bz] = true;
    acceptedEdges.push([ax, az, bx, bz]);
    addFrontier(bx, bz);
  }

  // Ekstra döngü kenarları (bazı komşu düğümleri de bağla ki sadece çıkmaz sokak olmasın)
  const edgeSet = new Set();
  acceptedEdges.forEach(([ax, az, bx, bz]) => {
    const a = ax + "," + az, b = bx + "," + bz;
    edgeSet.add(a < b ? a + "-" + b : b + "-" + a);
  });
  const LOOP_CHANCE = 0.2;
  for (let gx = 0; gx < GRID_N; gx++) {
    for (let gz = 0; gz < GRID_N; gz++) {
      if (gx + 1 < GRID_N) {
        const a = gx + "," + gz, b = (gx + 1) + "," + gz;
        const k = a < b ? a + "-" + b : b + "-" + a;
        if (!edgeSet.has(k) && Math.random() < LOOP_CHANCE) {
          edgeSet.add(k);
          acceptedEdges.push([gx, gz, gx + 1, gz]);
        }
      }
      if (gz + 1 < GRID_N) {
        const a = gx + "," + gz, b = gx + "," + (gz + 1);
        const k = a < b ? a + "-" + b : b + "-" + a;
        if (!edgeSet.has(k) && Math.random() < LOOP_CHANCE) {
          edgeSet.add(k);
          acceptedEdges.push([gx, gz, gx, gz + 1]);
        }
      }
    }
  }

  // Dereceleri ve komşuluk listesini çıkar (çıkmaz sokakları bulmak için)
  const degree = {};
  const adjList = {};
  acceptedEdges.forEach(([ax, az, bx, bz]) => {
    const ka = keyOf(ax, az), kb = keyOf(bx, bz);
    degree[ka] = (degree[ka] || 0) + 1;
    degree[kb] = (degree[kb] || 0) + 1;
    (adjList[ka] = adjList[ka] || []).push([bx, bz]);
    (adjList[kb] = adjList[kb] || []).push([ax, az]);
  });

  function getConnDirs(gx, gz) {
    const set = new Set();
    (adjList[keyOf(gx, gz)] || []).forEach(([ox, oz]) => {
      if (ox === gx + 1) set.add("E");
      if (ox === gx - 1) set.add("W");
      if (oz === gz + 1) set.add("S");
      if (oz === gz - 1) set.add("N");
    });
    return set;
  }

  // Geometriyi inşa et - kavşaklarda kaldırımlar çapraz asfalta binmesin diye içeri çekilir
  acceptedEdges.forEach(([ax, az, bx, bz]) => {
    const shrinkA = (degree[keyOf(ax, az)] || 0) >= 2 ? ROAD_WIDTH / 2 : 0;
    const shrinkB = (degree[keyOf(bx, bz)] || 0) >= 2 ? ROAD_WIDTH / 2 : 0;
    addStraightRoad(nodeWorldX(ax), nodeWorldZ(az), nodeWorldX(bx), nodeWorldZ(bz), shrinkA, shrinkB);
  });

  const deadEndBuildingSpots = [];

  // Kavşak noktalarını yuvarlak asfaltla doldur - dönüşler sert değil yumuşak hissettirsin
  // Her düğümde yol olmayan kenarları da kaldırımla kapat
  for (let gx = 0; gx < GRID_N; gx++) {
    for (let gz = 0; gz < GRID_N; gz++) {
      const deg = degree[keyOf(gx, gz)] || 0;
      if (deg === 0) continue;
      if (deg >= 2) addJunctionRound(nodeWorldX(gx), nodeWorldZ(gz));
      addOpenEdgeSidewalks(gx, gz, getConnDirs(gx, gz));
    }
  }

  // Çıkmaz sokakları (derece=1) kaldırımla kapat, ucuna bir bina koyarak gerçekten "çıkmaz" yap
  for (let gx = 0; gx < GRID_N; gx++) {
    for (let gz = 0; gz < GRID_N; gz++) {
      const k = keyOf(gx, gz);
      if ((degree[k] || 0) === 1) {
        const [nx2, nz2] = adjList[k][0];
        const dirX = Math.sign(gx - nx2), dirZ = Math.sign(gz - nz2);
        const nx = nodeWorldX(gx), nz = nodeWorldZ(gz);
        addDeadEndCap(nx, nz, dirX, dirZ);
        // Çıkmazın ucunu kapatan bina
        const capTipX = nx + dirX * (ROAD_WIDTH * 0.6 + SIDEWALK_WIDTH + 4);
        const capTipZ = nz + dirZ * (ROAD_WIDTH * 0.6 + SIDEWALK_WIDTH + 4);
        deadEndBuildingSpots.push([capTipX, capTipZ, dirX, dirZ]);
      }
    }
  }

  const spawnX = nodeWorldX(centerGX), spawnZ = nodeWorldZ(centerGZ);
  dlog("Yol ağı üretildi: " + GRID_N + "x" + GRID_N + " düğüm, " + acceptedEdges.length + " yol segmenti");

  // ---------------------------------------------------------
  // BİNALAR (basit, çarpışmalı, kaldırımın biraz ötesine yerleştirilir)
  // ---------------------------------------------------------
  const BUILDING_COLORS = [0xd8a45a, 0xb5735a, 0x8a9a8f, 0xc9b458, 0x9aa7b5, 0xb08968, 0x7a8b6f];
  const buildingWindowMat = new THREE.MeshStandardMaterial({ color: 0x1a2733, emissive: 0x2a3f55, emissiveIntensity: 0.15 });

  // Cepheye (sokağa bakan yüze) gerçekçi tekil pencere ızgarası ekler - şerit değil, tek tek pencereler
  function addFacadeWindowGrid(x, z, w, d, floors, floorH, fx, fz) {
    const facadeWidth = fx !== 0 ? d : w;
    const cols = Math.max(2, Math.min(6, Math.floor(facadeWidth / 1.8)));
    const count = cols * Math.max(0, floors - 1);
    if (count <= 0) return;

    const paneSpan = (facadeWidth / cols) * 0.6;
    const frameGeo = new THREE.BoxGeometry(
      fx !== 0 ? 0.1 : paneSpan,
      floorH * 0.52,
      fz !== 0 ? 0.1 : paneSpan
    );
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true });
    const inst = new THREE.InstancedMesh(frameGeo, frameMat, count);
    inst.castShadow = false;
    const dummy = new THREE.Object3D();
    const litColor = new THREE.Color(0xffe9a8);
    const darkColor = new THREE.Color(0x18222e);

    // Cam kısmı için ikinci, biraz daha küçük iç katman (çerçeve + cam hissi)
    const glassGeo = new THREE.BoxGeometry(
      fx !== 0 ? 0.14 : paneSpan * 0.75,
      floorH * 0.4,
      fz !== 0 ? 0.14 : paneSpan * 0.75
    );
    const glassInst = new THREE.InstancedMesh(glassGeo, frameMat, count);

    let idx = 0;
    for (let f = 1; f < floors; f++) {
      const y = f * floorH + floorH * 0.05;
      for (let c = 0; c < cols; c++) {
        const t = (c + 0.5) / cols - 0.5;
        let px, pz;
        if (fx !== 0) { px = x + fx * (w / 2 + 0.06); pz = z + t * facadeWidth * 0.82; }
        else { px = x + t * facadeWidth * 0.82; pz = z + fz * (d / 2 + 0.06); }

        dummy.position.set(px, y, pz);
        dummy.updateMatrix();
        inst.setMatrixAt(idx, dummy.matrix);
        inst.setColorAt(idx, 0xdadada);

        dummy.position.set(px + fx * 0.05, y, pz + fz * 0.05);
        dummy.updateMatrix();
        glassInst.setMatrixAt(idx, dummy.matrix);
        glassInst.setColorAt(idx, Math.random() < 0.4 ? litColor : darkColor);

        idx++;
      }
    }
    cityGroup.add(inst);
    cityGroup.add(glassInst);
  }

  function buildGenericBuilding(x, z, w, d, faceAxis, faceSign) {
    const floors = 2 + Math.floor(Math.random() * 4);
    const floorH = PLAYER_HEIGHT * 1.5;
    const h = floors * floorH;
    const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
    body.position.set(x, h / 2, z);
    body.castShadow = true;
    body.receiveShadow = true;
    cityGroup.add(body);

    const fx = faceAxis === "x" ? faceSign : 0;
    const fz = faceAxis === "z" ? faceSign : 0;

    addFacadeWindowGrid(x, z, w, d, floors, floorH, fx, fz);

    // Giriş kapısı - kaldırıma bakan cephenin zemin katında, çerçeveli
    const doorW = Math.min(1.6, (faceAxis === "x" ? d : w) * 0.3);
    const doorFrame = new THREE.Mesh(
      new THREE.BoxGeometry(fx !== 0 ? 0.1 : doorW + 0.2, floorH * 0.8, fz !== 0 ? 0.1 : doorW + 0.2),
      new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
    );
    doorFrame.position.set(x + fx * (w / 2 + 0.05), floorH * 0.4, z + fz * (d / 2 + 0.05));
    cityGroup.add(doorFrame);
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(fx !== 0 ? 0.08 : doorW, floorH * 0.72, fz !== 0 ? 0.08 : doorW),
      new THREE.MeshStandardMaterial({ color: 0x5a3a24 })
    );
    door.position.set(x + fx * (w / 2 + 0.09), floorH * 0.36, z + fz * (d / 2 + 0.09));
    cityGroup.add(door);

    registerCollider(x, z, w, d);
  }

  // Dükkan: tek katlı, geniş vitrin camlı, tenteli - apartmandan farklı bir siluet
  const SHOP_ACCENTS = [0xb5473a, 0x2e6b4f, 0x2a5a8a, 0xb08a2a, 0x7a3a8a];
  function buildGenericShop(x, z, w, d, faceAxis, faceSign) {
    const floorH = PLAYER_HEIGHT * 1.3;
    const h = floorH;
    const wallColor = 0xe8e2d0;
    const accent = SHOP_ACCENTS[Math.floor(Math.random() * SHOP_ACCENTS.length)];

    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: wallColor }));
    body.position.set(x, h / 2, z);
    body.castShadow = true;
    body.receiveShadow = true;
    cityGroup.add(body);

    const fx = faceAxis === "x" ? faceSign : 0;
    const fz = faceAxis === "z" ? faceSign : 0;
    const facadeWidth = fx !== 0 ? d : w;

    // Geniş vitrin camı
    const glass = new THREE.Mesh(
      new THREE.BoxGeometry(fx !== 0 ? 0.1 : facadeWidth * 0.75, h * 0.5, fz !== 0 ? 0.1 : facadeWidth * 0.75),
      new THREE.MeshStandardMaterial({ color: 0x9fd0e8, transparent: true, opacity: 0.5 })
    );
    glass.position.set(x + fx * (w / 2 + 0.06), h * 0.32, z + fz * (d / 2 + 0.06));
    cityGroup.add(glass);

    // Tente
    const awning = new THREE.Mesh(
      new THREE.BoxGeometry(fx !== 0 ? 0.7 : facadeWidth * 0.8, 0.12, fz !== 0 ? 0.7 : facadeWidth * 0.8),
      new THREE.MeshStandardMaterial({ color: accent })
    );
    awning.position.set(x + fx * (w / 2 + 0.35), h * 0.62, z + fz * (d / 2 + 0.35));
    cityGroup.add(awning);

    // Kapı
    const doorW = Math.min(1.4, facadeWidth * 0.28);
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(fx !== 0 ? 0.08 : doorW, h * 0.7, fz !== 0 ? 0.08 : doorW),
      new THREE.MeshStandardMaterial({ color: 0x3a2a1e })
    );
    door.position.set(x + fx * (w / 2 + 0.08) - fx * facadeWidth * 0.28, h * 0.35, z + fz * (d / 2 + 0.08) - fz * facadeWidth * 0.28);
    cityGroup.add(door);

    registerCollider(x, z, w, d);
  }

  // Yol segmentleri boyunca kaldırımın ötesine bina/dükkan diz (asfalta/kaldırıma binmesin diye pay bırakılır)
  acceptedEdges.forEach(([ax, az, bx, bz]) => {
    const x1 = nodeWorldX(ax), z1 = nodeWorldZ(az), x2 = nodeWorldX(bx), z2 = nodeWorldZ(bz);
    const horizontal = z1 === z2;
    const len = horizontal ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
    const margin = ROAD_WIDTH * 1.3;
    const usable = len - margin * 2;
    if (usable < 6) return;

    const dirSign = horizontal ? Math.sign(x2 - x1) : Math.sign(z2 - z1);
    const perpOffset = ROAD_WIDTH / 2 + SIDEWALK_WIDTH + 3.2;
    const spacing = 7 + Math.random() * 2.5;
    const count = Math.floor(usable / spacing);

    for (let i = 0; i < count; i++) {
      if (Math.random() < 0.08) continue; // çok az boşluk kalsın, kaldırım kenarı neredeyse hep dolu
      const distFromStart = margin + spacing * (i + 0.5);
      [-1, 1].forEach((side) => {
        const bw = 5 + Math.random() * 3, bd = 5 + Math.random() * 3;
        let bx, bz;
        if (horizontal) { bx = x1 + dirSign * distFromStart; bz = z1 + side * perpOffset; }
        else { bx = x1 + side * perpOffset; bz = z1 + dirSign * distFromStart; }
        // Bina, kendi tarafındaki kaldırıma (yola) bakacak şekilde yönlendirilir
        const faceAxis = horizontal ? "z" : "x";
        const faceSign = -side;
        if (Math.random() < 0.3) buildGenericShop(bx, bz, bw, bd, faceAxis, faceSign);
        else buildGenericBuilding(bx, bz, bw, bd, faceAxis, faceSign);
      });
    }
  });

  // Çıkmaz sokakların ucuna bina koyarak gerçekten kapalı hissettir - bina, geldiği sokağa bakar
  deadEndBuildingSpots.forEach(([bx, bz, dirX, dirZ]) => {
    const faceAxis = dirX !== 0 ? "x" : "z";
    const faceSign = dirX !== 0 ? -dirX : -dirZ;
    buildGenericBuilding(bx, bz, 7, 6, faceAxis, faceSign);
  });

  // ---------------------------------------------------------
  // PET SHOP - girilebilen tek dükkan (raflar + kasiyer)
  // Yol ağından bağımsız, ızgara çizgilerinin tam ortasında güvenli bir noktaya konur
  // ---------------------------------------------------------
  const foodItems = []; // { x, z, mesh, collected }

  function buildPetShop(x, z) {
    const w = 9, d = 7, wallH = PLAYER_HEIGHT * 1.7, wallT = 0.3, doorW = 2.0;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdfc9a0 });
    const shelfMat = new THREE.MeshStandardMaterial({ color: 0x6b4a3a });

    function wallBox(lx, lz, lw, ld) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(lw, wallH, ld), wallMat);
      m.position.set(x + lx, wallH / 2, z + lz);
      m.castShadow = true;
      m.receiveShadow = true;
      cityGroup.add(m);
      registerCollider(x + lx, z + lz, lw, ld);
    }

    wallBox(0, d / 2, w, wallT);            // arka duvar
    wallBox(-w / 2, 0, wallT, d);           // sol duvar
    wallBox(w / 2, 0, wallT, d);            // sağ duvar
    const segW = (w - doorW) / 2;
    wallBox(-(doorW / 2 + segW / 2), -d / 2, segW, wallT); // ön duvar sol parça
    wallBox((doorW / 2 + segW / 2), -d / 2, segW, wallT);  // ön duvar sağ parça (ortada kapı boşluğu)

    // Çatı - üstü kapalı
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.6, 0.3, d + 0.6),
      new THREE.MeshStandardMaterial({ color: 0x7a4a30 })
    );
    roof.position.set(x, wallH + 0.15, z);
    roof.castShadow = true;
    cityGroup.add(roof);

    // Tabela - canvas ile gerçek "PET SHOP" yazısı
    const signCanvas = document.createElement("canvas");
    signCanvas.width = 512; signCanvas.height = 128;
    const sctx = signCanvas.getContext("2d");
    sctx.fillStyle = "#e08030";
    sctx.fillRect(0, 0, 512, 128);
    sctx.strokeStyle = "#ffffff";
    sctx.lineWidth = 6;
    sctx.strokeRect(8, 8, 496, 112);
    sctx.fillStyle = "#ffffff";
    sctx.font = "bold 64px Arial";
    sctx.textAlign = "center";
    sctx.textBaseline = "middle";
    sctx.fillText("🐾 PET SHOP", 256, 68);
    const signTex = new THREE.CanvasTexture(signCanvas);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(3.4, 0.85),
      new THREE.MeshStandardMaterial({ map: signTex })
    );
    sign.position.set(x, wallH + 0.55, z - d / 2 - 0.08);
    cityGroup.add(sign);

    // İç zemin
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(w - 0.4, d - 0.4),
      new THREE.MeshStandardMaterial({ color: 0xf0e6d2 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(x, 0.03, z);
    floor.receiveShadow = true;
    cityGroup.add(floor);

    // 4 raf
    const shelfSpots = [[-w / 2 + 1.1, -d / 2 + 1.8], [-w / 2 + 1.1, 0], [-w / 2 + 1.1, d / 2 - 1.6], [w / 2 - 1.1, -d / 2 + 1.8]];
    shelfSpots.forEach(([sx, sz], shelfIdx) => {
      const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.4, 1.8), shelfMat);
      shelf.position.set(x + sx, 0.7, z + sz);
      shelf.castShadow = true;
      cityGroup.add(shelf);
      registerCollider(x + sx, z + sz, 0.6, 1.8);

      if (shelfIdx === 0) {
        // Bu raf kedi maması rafı - sadece insan alabilir
        for (let i = 0; i < 3; i++) {
          const canGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.22, 10);
          const canMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
          const can = new THREE.Mesh(canGeo, canMat);
          const fx = x + sx + 0.35, fz = z + sz + (i - 1) * 0.55;
          can.position.set(fx, 1.1, fz);
          cityGroup.add(can);
          foodItems.push({ x: fx, z: fz, mesh: can, collected: false });
        }
      } else {
        for (let i = 0; i < 3; i++) {
          const item = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.3), new THREE.MeshStandardMaterial({ color: Math.floor(Math.random() * 0xffffff) }));
          item.position.set(x + sx, 1.05, z + sz + (i - 1) * 0.55);
          cityGroup.add(item);
        }
      }
    });

    // Kasiyer tezgahı + dekoratif kasiyer figürü
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 0.7), shelfMat);
    counter.position.set(x, 0.5, z + d / 2 - 1.2);
    counter.castShadow = true;
    cityGroup.add(counter);
    registerCollider(x, z + d / 2 - 1.2, 2.2, 0.7);

    const cashier = createPlayerMesh(0x445566);
    cashier.position.set(x, 0, z + d / 2 - 1.9);
    cashier.rotation.y = Math.PI;
    cityGroup.add(cashier);
  }

  // Grid çizgilerinin tam ortası, hangi yol ağı üretilirse üretilsin daima boş/güvenli bir nokta
  const petShopX = spawnX + NODE_SPACING * 0.5;
  const petShopZ = spawnZ - NODE_SPACING * 0.5;
  buildPetShop(petShopX, petShopZ);

  // ---------------------------------------------------------
  // OYUNCU (kendi karakterin)
  // ---------------------------------------------------------
  function createPlayerMesh(color) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1.6, 0.6),
      new THREE.MeshStandardMaterial({ color })
    );
    body.position.y = 0.8;
    body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.6, 0.6),
      new THREE.MeshStandardMaterial({ color: 0xffdbac })
    );
    head.position.y = 1.9;
    head.castShadow = true;
    group.add(head);

    return group;
  }

  function createCatMesh(color) {
    const group = new THREE.Group();
    const furColor = color || 0xd88a3a;
    const furMat = new THREE.MeshStandardMaterial({ color: furColor });

    // Model, hareket yönü ile tutarlı olsun diye "önü" +Z eksenine bakacak şekilde kuruldu
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.95), furMat);
    body.position.y = 0.32;
    body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.32, 0.32), furMat);
    head.position.set(0, 0.5, 0.58);
    head.castShadow = true;
    group.add(head);

    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 0.14), new THREE.MeshStandardMaterial({ color: 0xffe4c4 }));
    snout.position.set(0, 0.44, 0.78);
    group.add(snout);

    // Sivri kedi kulakları
    [-0.1, 0.1].forEach((ox) => {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 4), furMat);
      ear.position.set(ox, 0.7, 0.55);
      ear.rotation.y = Math.PI / 4;
      group.add(ear);
    });

    // Bacaklar (ön-arka, sol-sağ)
    [[-0.15, -0.32], [0.15, -0.32], [-0.15, 0.32], [0.15, 0.32]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.32, 6), furMat);
      leg.position.set(lx, 0.16, lz);
      leg.castShadow = true;
      group.add(leg);
    });

    // İnce, uzun kedi kuyruğu - geriye ve yukarı kıvrık
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.02, 0.55, 6), furMat);
    tail.position.set(0, 0.5, -0.55);
    tail.rotation.x = -Math.PI / 3;
    group.add(tail);

    // Dikenli tasma: boyunda halka + etrafında metalik dikenler
    const collarMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.035, 6, 12), collarMat);
    collar.position.set(0, 0.42, 0.4);
    group.add(collar);

    const spikeMat = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 0.6, roughness: 0.3 });
    const spikeCount = 8;
    for (let i = 0; i < spikeCount; i++) {
      const ang = (i / spikeCount) * Math.PI * 2;
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.08, 5), spikeMat);
      spike.position.set(Math.cos(ang) * 0.19, Math.sin(ang) * 0.19 + 0.42, 0.4);
      spike.rotation.z = ang - Math.PI / 2;
      group.add(spike);
    }

    group.userData.collarWorldOffset = new THREE.Vector3(0, 0.42, 0.4);
    return group;
  }

  function createCharacterMesh(type, color) {
    return type === "cat" ? createCatMesh(color) : createPlayerMesh(color);
  }

  const myColor = Math.floor(Math.random() * 0xffffff);
  let myPlayerType = "human";
  let myMesh = createPlayerMesh(myColor);
  scene.add(myMesh);

  // ---------------------------------------------------------
  // KLAVYE / JOYSTICK / KAMERA KONTROLLERİ
  // ---------------------------------------------------------
  const keys = {};
  window.addEventListener("keydown", (e) => {
    if (document.activeElement && document.activeElement.id === "chatInput") return;
    keys[e.code] = true;
  });
  window.addEventListener("keyup", (e) => {
    if (document.activeElement && document.activeElement.id === "chatInput") return;
    keys[e.code] = false;
  });

  const isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isTouchDevice) {
    document.getElementById("joystickZone").style.display = "block";
    document.getElementById("jumpBtn").style.display = "block";
    document.getElementById("controlHint").textContent = "Sol joystick hareket, sağ buton zıpla";
  }

  let joyDx = 0, joyDz = 0;
  const joystickZone = document.getElementById("joystickZone");
  const joystickStick = document.getElementById("joystickStick");
  let joyActive = false;
  let joyTouchId = null;
  const JOY_RADIUS = 65;

  function joyReset() {
    joyDx = 0; joyDz = 0;
    joystickStick.style.left = "35px";
    joystickStick.style.top = "35px";
  }

  joystickZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joyActive = true;
  }, { passive: false });

  window.addEventListener("touchmove", (e) => {
    if (!joyActive) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== joyTouchId) continue;
      const rect = joystickZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = t.clientX - cx;
      let dy = t.clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > JOY_RADIUS) {
        dx = (dx / dist) * JOY_RADIUS;
        dy = (dy / dist) * JOY_RADIUS;
      }
      joystickStick.style.left = (35 + dx) + "px";
      joystickStick.style.top = (35 + dy) + "px";
      joyDx = dx / JOY_RADIUS;
      joyDz = dy / JOY_RADIUS;
    }
  }, { passive: false });

  window.addEventListener("touchend", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        joyActive = false;
        joyTouchId = null;
        joyReset();
      }
    }
  });

  let wantJump = false;
  const jumpBtn = document.getElementById("jumpBtn");
  jumpBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    wantJump = true;
  }, { passive: false });

  // Kamera döndürme (sağ taraftan sürükle)
  let camYaw = 0;
  let camPitch = 0.35;
  let camTouchId = null;
  let lastCamX = 0, lastCamY = 0;

  window.addEventListener("touchstart", (e) => {
    for (const t of e.changedTouches) {
      if (camTouchId !== null) continue;
      if (joystickZone.contains(t.target) || jumpBtn.contains(t.target)) continue;
      if (t.clientX < window.innerWidth / 2) continue;
      camTouchId = t.identifier;
      lastCamX = t.clientX;
      lastCamY = t.clientY;
    }
  }, { passive: true });

  window.addEventListener("touchmove", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== camTouchId) continue;
      const dx = t.clientX - lastCamX;
      const dy = t.clientY - lastCamY;
      lastCamX = t.clientX;
      lastCamY = t.clientY;
      camYaw -= dx * 0.006;
      camPitch = Math.max(0.05, Math.min(1.1, camPitch + dy * 0.004));
    }
  }, { passive: true });

  window.addEventListener("touchend", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });

  let velocityY = 0;
  let isGrounded = true;
  const moveSpeed = 8;
  const jumpForce = 8;
  const gravity = -20;

  const PLAYER_RADIUS = 0.4;
  function collidesAt(x, z) {
    for (let i = 0; i < collidables.length; i++) {
      const c = collidables[i];
      if (x + PLAYER_RADIUS > c.minX && x - PLAYER_RADIUS < c.maxX &&
          z + PLAYER_RADIUS > c.minZ && z - PLAYER_RADIUS < c.maxZ) {
        return true;
      }
    }
    return false;
  }

  function updateLocalPlayer(delta) {
    // Kedi bayılmışsa kendi kontrolü devre dışı (insan sürükler) ama kamera hâlâ dönebilir/takip eder
    const canMove = !(myPlayerType === "cat" && isDowned);

    if (canMove) {
      let dx = 0, dz = 0;
      if (keys["KeyW"]) dz -= 1;
      if (keys["KeyS"]) dz += 1;
      if (keys["KeyA"]) dx -= 1;
      if (keys["KeyD"]) dx += 1;
      dx += joyDx;
      dz += joyDz;

      const inputLen = Math.hypot(dx, dz);
      if (inputLen > 0) {
        dx /= inputLen; dz /= inputLen;

        const forwardX = -Math.sin(camYaw);
        const forwardZ = -Math.cos(camYaw);
        const rightX = Math.cos(camYaw);
        const rightZ = -Math.sin(camYaw);

        const forwardInput = -dz;
        const strafeInput = dx;

        let moveX = forwardX * forwardInput + rightX * strafeInput;
        let moveZ = forwardZ * forwardInput + rightZ * strafeInput;
        const moveLen = Math.hypot(moveX, moveZ);
        if (moveLen > 0) {
          moveX /= moveLen; moveZ /= moveLen;
          myMesh.rotation.y = Math.atan2(moveX, moveZ);

          const nextX = myMesh.position.x + moveX * moveSpeed * delta;
          const nextZ = myMesh.position.z + moveZ * moveSpeed * delta;
          if (!collidesAt(nextX, myMesh.position.z)) myMesh.position.x = nextX;
          if (!collidesAt(myMesh.position.x, nextZ)) myMesh.position.z = nextZ;
        }
      }

      if ((keys["Space"] || wantJump) && isGrounded) {
        velocityY = jumpForce;
        isGrounded = false;
      }
      wantJump = false;

      velocityY += gravity * delta;
      myMesh.position.y += velocityY * delta;
      if (myMesh.position.y <= 0) {
        myMesh.position.y = 0;
        velocityY = 0;
        isGrounded = true;
      }
    }

    // Kamera her zaman güncellensin - bayılan kedi bile kamerayı çevirebilsin, kamera onu takip etmeye devam etsin
    const dist = 7;
    const horizDist = dist * Math.cos(camPitch);
    const height = dist * Math.sin(camPitch) + 1.5;
    const camOffset = new THREE.Vector3(
      horizDist * Math.sin(camYaw),
      height,
      horizDist * Math.cos(camYaw)
    );
    const targetCamPos = myMesh.position.clone().add(camOffset);
    camera.position.lerp(targetCamPos, 0.15);
    camera.lookAt(myMesh.position.clone().add(new THREE.Vector3(0, 1, 0)));
  }

  // ---------------------------------------------------------
  // ÇOKLU OYUNCU SENKRON (Firestore)
  // ---------------------------------------------------------
  let myPlayerId = null;
  let myPlayerName = "Oyuncu";
  const otherPlayers = {};

  // --- Tasma sistemi ---
  let myLeashLength = 4;
  const leashValueEl = document.getElementById("leashValue");
  document.getElementById("leashMinus").addEventListener("click", () => {
    myLeashLength = Math.max(2, myLeashLength - 0.5);
    leashValueEl.textContent = myLeashLength;
  });
  document.getElementById("leashPlus").addEventListener("click", () => {
    myLeashLength = Math.min(10, myLeashLength + 0.5);
    leashValueEl.textContent = myLeashLength;
  });

  // --- Mama toplama (sadece insan) ve besleme sistemi ---
  let myFoodCount = 0;
  const foodCountValEl = document.getElementById("foodCountVal");
  function updateFoodCountDisplay() {
    foodCountValEl.textContent = myFoodCount;
  }

  function updateFoodPickup() {
    if (myPlayerType !== "human") return;
    for (const item of foodItems) {
      if (item.collected) continue;
      const dx = myMesh.position.x - item.x, dz = myMesh.position.z - item.z;
      if (Math.hypot(dx, dz) < 1.3) {
        item.collected = true;
        scene.remove(item.mesh);
        myFoodCount++;
        updateFoodCountDisplay();
        dlog("Mama aldın! Toplam: " + myFoodCount);
      }
    }
  }

  document.getElementById("feedBtn").addEventListener("click", () => {
    if (myFoodCount <= 0) { dlog("Elinde mama yok, önce Pet Shop'tan al"); return; }
    const pet = findNearestOfType("cat");
    if (!pet) { dlog("Yakında kedi yok"); return; }
    const dist = myMesh.position.distanceTo(pet.mesh.position);
    if (dist > (myLeashLength + 2)) { dlog("Kedi çok uzakta, mama veremezsin"); return; }
    myFoodCount--;
    updateFoodCountDisplay();
    addDoc(eventsCol, { type: "feed", targetId: pet.id, ts: serverTimestamp() })
      .catch(err => dlog("MAMA HATASI: " + err.code + " - " + err.message));
  });

  // Tasma çizgisi (insan-köpek arasında görsel bağ)
  // Tasma - gerçek geometri (ince silindir), görünürlüğü artırmak için Line yerine mesh kullanılıyor
  const leashGeo = new THREE.CylinderGeometry(0.045, 0.045, 1, 6);
  const leashMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1a });
  const leashMesh = new THREE.Mesh(leashGeo, leashMat);
  leashMesh.visible = false;
  scene.add(leashMesh);

  function stretchLeashBetween(pointA, pointB) {
    const dir = new THREE.Vector3().subVectors(pointB, pointA);
    const len = dir.length();
    if (len < 0.01) { leashMesh.visible = false; return; }
    leashMesh.visible = true;
    leashMesh.position.copy(pointA).addScaledVector(dir, 0.5);
    leashMesh.scale.set(1, len, 1);
    leashMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  }

  function findNearestOfType(type) {
    let nearest = null, nearestDist = Infinity;
    for (const id in otherPlayers) {
      const p = otherPlayers[id];
      if (p.type !== type) continue;
      const d = myMesh.position.distanceTo(p.mesh.position);
      if (d < nearestDist) { nearestDist = d; nearest = p; }
    }
    return nearest;
  }

  const downedBannerEl = document.getElementById("downedBanner");

  function updateLeash() {
    if (myPlayerType === "cat") {
      const owner = findNearestOfType("human");
      if (owner) {
        const leashLen = owner.leashLength || 4;
        const dx = myMesh.position.x - owner.mesh.position.x;
        const dz = myMesh.position.z - owner.mesh.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist > leashLen) {
          const scale = leashLen / dist;
          myMesh.position.x = owner.mesh.position.x + dx * scale;
          myMesh.position.z = owner.mesh.position.z + dz * scale;
        }
        stretchLeashBetween(
          myMesh.position.clone().add(new THREE.Vector3(0, 0.42, 0)),
          owner.mesh.position.clone().add(new THREE.Vector3(0, 1.15, 0))
        );
      } else {
        leashMesh.visible = false;
      }
    } else if (myPlayerType === "human") {
      const pet = findNearestOfType("cat");
      if (pet) {
        stretchLeashBetween(
          myMesh.position.clone().add(new THREE.Vector3(0, 1.15, 0)),
          pet.mesh.position.clone().add(new THREE.Vector3(0, 0.42, 0))
        );
        downedBannerEl.style.display = pet.downed ? "block" : "none";
      } else {
        leashMesh.visible = false;
        downedBannerEl.style.display = "none";
      }
    }
  }

  // ---------------------------------------------------------
  // OYUN İÇİ SAAT + GECE-GÜNDÜZ DÖNGÜSÜ (dijital gösterge, sol üst)
  // ---------------------------------------------------------
  const DAY_LENGTH_SECONDS = 480; // 8 dakika = 1 oyun günü
  const DAY_START_OFFSET_HOURS = 9.5; // oyun "günü" gerçek saat 00:00 UTC'de bu saatten başlıyormuş gibi hesaplanır
  const clockDigitsEl = document.getElementById("clockDigits");

  const SKY_NIGHT = new THREE.Color(0x0a1128);
  const SKY_DAWN = new THREE.Color(0xe8926a);
  const SKY_DAY = new THREE.Color(0x87ceeb);
  const SKY_DUSK = new THREE.Color(0xd9754f);
  function lerpColor3(c1, c2, t) {
    return c1.clone().lerp(c2, Math.max(0, Math.min(1, t)));
  }

  // Herkeste AYNI saati göstermek için: yerel delta biriktirmek yerine
  // doğrudan gerçek zamandan (Date.now) hesaplanır - hangi cihaz/ne zaman katılırsa katılsın sonuç aynı olur
  function getGameHours() {
    const cycleMs = DAY_LENGTH_SECONDS * 1000;
    const progress = ((Date.now() % cycleMs) / cycleMs); // 0..1
    let h = (progress * 24 + DAY_START_OFFSET_HOURS) % 24;
    return h;
  }

  function updateClock() {
    const h = getGameHours();
    const hh = Math.floor(h);
    const mm = Math.floor((h - hh) * 60);
    clockDigitsEl.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");

    // Gece-gündüz görsel geçişi
    let skyColor, sunIntensity, hemiIntensity;
    if (h < 5) { skyColor = SKY_NIGHT; sunIntensity = 0.08; hemiIntensity = 0.3; }
    else if (h < 7) { const t = (h - 5) / 2; skyColor = lerpColor3(SKY_NIGHT, SKY_DAWN, t); sunIntensity = 0.08 + t * 0.6; hemiIntensity = 0.3 + t * 0.5; }
    else if (h < 9) { const t = (h - 7) / 2; skyColor = lerpColor3(SKY_DAWN, SKY_DAY, t); sunIntensity = 0.68 + t * 0.52; hemiIntensity = 0.8 + t * 0.4; }
    else if (h < 17) { skyColor = SKY_DAY; sunIntensity = 1.2; hemiIntensity = 1.2; }
    else if (h < 19) { const t = (h - 17) / 2; skyColor = lerpColor3(SKY_DAY, SKY_DUSK, t); sunIntensity = 1.2 - t * 0.55; hemiIntensity = 1.2 - t * 0.4; }
    else if (h < 21) { const t = (h - 19) / 2; skyColor = lerpColor3(SKY_DUSK, SKY_NIGHT, t); sunIntensity = 0.65 - t * 0.57; hemiIntensity = 0.8 - t * 0.5; }
    else { skyColor = SKY_NIGHT; sunIntensity = 0.08; hemiIntensity = 0.3; }

    scene.background.copy(skyColor);
    scene.fog.color.copy(skyColor);
    sunLight.intensity = sunIntensity;
    hemiLight.intensity = hemiIntensity;
  }

  // ---------------------------------------------------------
  // CAN SİSTEMİ + ELEKTRİK ŞOKU (insan kediye şok verebilir)
  // Can biterse kedi bir süre yan yatıp hareket edemez, insan bu sırada onu sürükleyebilir
  // ---------------------------------------------------------
  let myHealth = 100;
  let isDowned = false;
  let downedTimer = 0;
  const DOWNED_DURATION = 8; // saniye
  const healthBarInner = document.getElementById("healthBarInner");
  function updateHealthBar() {
    healthBarInner.style.width = Math.max(0, myHealth) + "%";
    healthBarInner.style.background = myHealth > 50 ? "#4CAF50" : myHealth > 20 ? "#e0a030" : "#e03030";
  }
  updateHealthBar();

  function goDown() {
    if (isDowned) return;
    isDowned = true;
    downedTimer = DOWNED_DURATION;
    myMesh.rotation.z = Math.PI / 2; // yan yat
    dlog("Kedi bayıldı, " + DOWNED_DURATION + " saniye hareket edemez");
  }

  function updateDownedState(delta) {
    if (myPlayerType !== "cat" || !isDowned) return;
    downedTimer -= delta;

    // İnsan yakındaysa (tasma sahibi) yerde yatarken onu sürükleyebilsin
    const owner = findNearestOfType("human");
    if (owner) {
      const dx = myMesh.position.x - owner.mesh.position.x;
      const dz = myMesh.position.z - owner.mesh.position.z;
      const dist = Math.hypot(dx, dz);
      const dragRadius = 1.6; // insan bu mesafeden uzaklaşırsa yatan kediyi de çeker
      if (dist > dragRadius) {
        const scale = dragRadius / dist;
        myMesh.position.x = owner.mesh.position.x + dx * scale;
        myMesh.position.z = owner.mesh.position.z + dz * scale;
      }
    }

    if (downedTimer <= 0) {
      isDowned = false;
      myHealth = 40; // kısmi toparlanma
      myMesh.rotation.z = 0;
      updateHealthBar();
      dlog("Kedi toparlandı, can: " + myHealth);
    }
  }

  const eventsCol = collection(db, "rooms", ROOM_ID, "events");
  let eventsReady = false;

  function listenShockEvents() {
    onSnapshot(eventsCol, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type !== "added") return;
        if (!eventsReady) return; // ilk yüklemede eski olayları tekrar işleme
        const data = change.doc.data();
        if (data.type === "shock" && data.targetId === myPlayerId && myPlayerType === "cat") {
          myHealth = Math.max(0, myHealth - 15);
          updateHealthBar();
          dlog("Şok aldın! Can: " + myHealth);
          if (myHealth <= 0) goDown();
        }
        if (data.type === "feed" && data.targetId === myPlayerId && myPlayerType === "cat") {
          myHealth = 100;
          updateHealthBar();
          dlog("Mama yedin! Can doldu.");
          if (isDowned) {
            isDowned = false;
            downedTimer = 0;
            myMesh.rotation.z = 0;
          }
        }
      });
      eventsReady = true;
    }, (err) => dlog("EVENTS HATASI: " + err.code + " - " + err.message));
  }

  document.getElementById("zapBtn").addEventListener("click", () => {
    const pet = findNearestOfType("cat");
    if (!pet) { dlog("Yakında kedi yok"); return; }
    const dist = myMesh.position.distanceTo(pet.mesh.position);
    if (dist > (myLeashLength + 2)) { dlog("Kedi çok uzakta, şok veremezsin"); return; }
    addDoc(eventsCol, { type: "shock", targetId: pet.id, ts: serverTimestamp() })
      .catch(err => dlog("ŞOK HATASI: " + err.code + " - " + err.message));
  });

  let lastSentTime = 0;
  const SEND_INTERVAL = 100;

  function sendMyPosition() {
    if (!myPlayerId) return;
    const now = performance.now();
    if (now - lastSentTime < SEND_INTERVAL) return;
    lastSentTime = now;

    setDoc(doc(playersCol, myPlayerId), {
      name: myPlayerName,
      color: myColor,
      type: myPlayerType,
      leashLength: myLeashLength,
      health: myHealth,
      downed: isDowned,
      x: myMesh.position.x,
      y: myMesh.position.y,
      z: myMesh.position.z,
      rotY: myMesh.rotation.y,
      updatedAt: serverTimestamp()
    }, { merge: true }).catch(err => dlog("YAZMA HATASI: " + err.code + " - " + err.message));
  }

  function listenOtherPlayers() {
    dlog("Firestore dinleme başlatılıyor, oda=" + ROOM_ID + ", benim ID=" + myPlayerId);
    onSnapshot(playersCol, (snapshot) => {
      const activeIds = new Set();
      const now = Date.now();
      const STALE_MS = 6000;
      const VERY_STALE_MS = 30000;

      snapshot.forEach((docSnap) => {
        const id = docSnap.id;
        if (id === myPlayerId) return;
        const data = docSnap.data();

        let ageMs = 0;
        if (data.updatedAt && typeof data.updatedAt.toMillis === "function") {
          ageMs = now - data.updatedAt.toMillis();
        }

        if (ageMs > VERY_STALE_MS) {
          deleteDoc(doc(playersCol, id)).catch(() => {});
          if (otherPlayers[id]) {
            scene.remove(otherPlayers[id].mesh);
            delete otherPlayers[id];
          }
          return;
        }

        if (ageMs > STALE_MS) {
          if (otherPlayers[id]) {
            scene.remove(otherPlayers[id].mesh);
            delete otherPlayers[id];
          }
          return;
        }

        activeIds.add(id);

        if (!otherPlayers[id]) {
          const mesh = createCharacterMesh(data.type || "human", data.color || 0xff0000);
          scene.add(mesh);
          otherPlayers[id] = {
            id,
            mesh,
            type: data.type || "human",
            leashLength: data.leashLength || 4,
            downed: !!data.downed,
            targetPos: new THREE.Vector3(data.x, data.y, data.z),
            targetRotY: data.rotY || 0
          };
        } else {
          otherPlayers[id].type = data.type || "human";
          otherPlayers[id].leashLength = data.leashLength || 4;
          otherPlayers[id].downed = !!data.downed;
          otherPlayers[id].targetPos.set(data.x, data.y, data.z);
          otherPlayers[id].targetRotY = data.rotY || 0;
        }
        // Bayılan kedi diğer oyunculara da yan yatmış görünsün
        if (otherPlayers[id].type === "cat") {
          otherPlayers[id].mesh.rotation.z = otherPlayers[id].downed ? Math.PI / 2 : 0;
        }
      });

      for (const id in otherPlayers) {
        if (!activeIds.has(id)) {
          scene.remove(otherPlayers[id].mesh);
          delete otherPlayers[id];
        }
      }

      document.getElementById("playerCount").textContent = activeIds.size + 1;
    }, (err) => {
      dlog("DİNLEME HATASI: " + err.code + " - " + err.message);
    });
  }

  function updateOtherPlayers(delta) {
    for (const id in otherPlayers) {
      const p = otherPlayers[id];
      p.mesh.position.lerp(p.targetPos, 0.15);
      p.mesh.rotation.y += (p.targetRotY - p.mesh.rotation.y) * 0.15;
      if (p.type === "cat") {
        p.mesh.rotation.z = p.downed ? Math.PI / 2 : 0;
      }
    }

    // İnsan tarafında: eşleştiği kedi bayıldıysa uyarı göster
    if (myPlayerType === "human") {
      const pet = findNearestOfType("cat");
      const downedBannerEl = document.getElementById("downedBanner");
      if (pet && pet.downed) {
        downedBannerEl.style.display = "block";
      } else {
        downedBannerEl.style.display = "none";
      }
    }
  }

  window.addEventListener("beforeunload", () => {
    if (myPlayerId) {
      deleteDoc(doc(playersCol, myPlayerId));
    }
  });

  // ---------------------------------------------------------
  // CHAT SİSTEMİ (Firestore üzerinden)
  // ---------------------------------------------------------
  const chatMessagesEl = document.getElementById("chatMessages");
  const chatInputEl = document.getElementById("chatInput");
  const chatSendBtnEl = document.getElementById("chatSendBtn");

  function sendChatMessage() {
    const text = chatInputEl.value.trim();
    if (!text || !myPlayerId) return;
    chatInputEl.value = "";
    addDoc(chatCol, {
      name: myPlayerName,
      text: text.slice(0, 120),
      createdAt: serverTimestamp()
    }).catch(err => dlog("CHAT YAZMA HATASI: " + err.code + " - " + err.message));
  }

  chatSendBtnEl.addEventListener("click", sendChatMessage);
  chatInputEl.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") sendChatMessage();
  });

  function listenChat() {
    const chatQuery = query(chatCol, orderBy("createdAt", "desc"), limit(30));
    onSnapshot(chatQuery, (snapshot) => {
      const msgs = [];
      snapshot.forEach((docSnap) => msgs.push(docSnap.data()));
      msgs.reverse();

      chatMessagesEl.innerHTML = "";
      msgs.forEach((m) => {
        const line = document.createElement("div");
        const nameSpan = document.createElement("b");
        nameSpan.textContent = (m.name || "Oyuncu") + ": ";
        line.appendChild(nameSpan);
        line.appendChild(document.createTextNode(m.text || ""));
        chatMessagesEl.appendChild(line);
      });
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }, (err) => {
      dlog("CHAT DİNLEME HATASI: " + err.code + " - " + err.message);
    });
  }

  // ---------------------------------------------------------
  // KARAKTER SEÇİMİ (İnsan / Köpek)
  // ---------------------------------------------------------
  document.querySelectorAll(".charOption").forEach((el) => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".charOption").forEach((o) => o.classList.remove("selected"));
      el.classList.add("selected");
      myPlayerType = el.dataset.type;
    });
  });

  // ---------------------------------------------------------
  // OYUNA KATILMA EKRANI
  // ---------------------------------------------------------
  document.getElementById("joinBtn").addEventListener("click", startGame);
  document.getElementById("playerNameInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") startGame();
  });

  function startGame() {
    const nameInput = document.getElementById("playerNameInput");
    myPlayerName = (nameInput.value || "Oyuncu").trim().slice(0, 12) || "Oyuncu";
    myPlayerId = "p_" + Math.random().toString(36).slice(2, 10);

    // Seçilen türe göre karakteri yeniden oluştur (varsayılan insan yerine)
    scene.remove(myMesh);
    myMesh = createCharacterMesh(myPlayerType, myColor);
    scene.add(myMesh);

    document.getElementById("nameEntry").style.display = "none";
    document.getElementById("hud").style.display = "block";
    document.getElementById("chatBox").style.display = "flex";
    document.getElementById("myName").textContent = myPlayerName + (myPlayerType === "cat" ? " 🐱" : " 🧍");
    if (myPlayerType === "human") {
      document.getElementById("leashControl").style.display = "flex";
      document.getElementById("zapBtn").style.display = "flex";
    }
    dlog("Katıldın: " + myPlayerName + " (" + myPlayerType + ", ID: " + myPlayerId + ")");

    listenOtherPlayers();
    listenChat();
    listenShockEvents();
    animate();
  }

  // ---------------------------------------------------------
  // ANA DÖNGÜ
  // ---------------------------------------------------------
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);

    updateLocalPlayer(delta);
    updateOtherPlayers(delta);
    updateLeash();
    updateDownedState(delta);
    updateClock();
    sendMyPosition();

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
